
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100817"/>
      <stop offset="100%" stop-color="#071319"/>
    </linearGradient>

    <filter id="pinkGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- Decorative lines -->
  <path d="M0 250 L300 250 L350 200"
        stroke="#35F2E0" stroke-width="1" opacity="0.5" fill="none"/>

  <path d="M1000 50 L750 50 L700 100"
        stroke="#FF2DAA" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- Main title -->
  <text x="500" y="130"
        text-anchor="middle"
        font-family="Arial"
        font-size="65"
        font-weight="bold"
        fill="#FF2DAA"
        filter="url(#pinkGlow)">
    LAMIS
  </text>

  <!-- Subtitle -->
  <text x="500" y="180"
        text-anchor="middle"
        font-family="Arial"
        font-size="23"
        letter-spacing="5"
        fill="#35F2E0">
    ASPIRING DEVELOPER
  </text>

  <!-- Footer -->
  <text x="500" y="230"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        letter-spacing="3"
        fill="#FFFFFF">
    CODE  /  CREATE  /  REPEAT
  </text>

</svg>
